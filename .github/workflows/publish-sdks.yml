name: Publish SDKs

# 发布 SDK 到包管理器。默认只构建并上传 artifact；真正的发布仅在 release
# 事件或手动勾选 publish=true 时执行。版本号来自各包清单，发布前请确认一致。
# EN: Build SDK artifacts by default; publish only on release events or manual
# dispatch with publish=true.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish the selected ecosystems"
        type: boolean
        default: false
      ecosystems:
        description: "Comma-separated: python,npm,nuget,crates (default python)"
        type: string
        default: "python"

permissions:
  contents: read
  id-token: write # PyPI Trusted Publishing / npm provenance

concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python (${{ matrix.pkg }})
    # 只在公共社区仓发布；开发仓没有发布凭据。
    # EN: publish from the public community repo only; the dev repo has no
    # EN: publishing credentials.
    if: github.repository == 'houyidb-community/houyidb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PyPI 的 pending publisher 以 (owner, repo, workflow, environment) 唯一：
    # 同一个 monorepo 不能给多个未创建项目复用同一组配置。每个包使用独立
    # environment，分别登记 pending publisher。
    # EN: PyPI pending publishers are unique per (owner, repo, workflow,
    # EN: environment). Use one environment per package in a monorepo.
    environment: ${{ matrix.pypi_env }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: sdk/python/houyidb
            pypi_env: pypi
          - pkg: sdk/python/langchain-houyidb
            pypi_env: pypi-langchain
          - pkg: sdk/python/llama-index-vector-stores-houyidb
            pypi_env: pypi-llama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --outdir dist
        working-directory: ${{ matrix.pkg }}
      - run: python -m twine check dist/*
        working-directory: ${{ matrix.pkg }}
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ strategy.job-index }}
          path: ${{ matrix.pkg }}/dist/*
      - if: >-
          (github.event_name == 'release' || inputs.publish) &&
          (github.event_name == 'release' || contains(inputs.ecosystems, 'python'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.pkg }}/dist

  npm:
    name: npm
    if: github.repository == 'houyidb-community/houyidb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        working-directory: sdk/typescript/houyidb
      - run: npm run build
        working-directory: sdk/typescript/houyidb
      - run: npm test
        working-directory: sdk/typescript/houyidb
      - run: npm pack --pack-destination dist
        working-directory: sdk/typescript/houyidb
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdk/typescript/houyidb/dist/*.tgz
      - if: >-
          (github.event_name == 'release' || inputs.publish) &&
          (github.event_name == 'release' || contains(inputs.ecosystems, 'npm'))
        run: npm publish --provenance --access public
        working-directory: sdk/typescript/houyidb
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nuget:
    name: NuGet
    if: github.repository == 'houyidb-community/houyidb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --nologo -v q
        working-directory: sdk/dotnet
      - run: dotnet pack src/HouyiDb/HouyiDb.csproj -c Release -o dist
        working-directory: sdk/dotnet
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: sdk/dotnet/dist/*.nupkg
      - if: >-
          (github.event_name == 'release' || inputs.publish) &&
          (github.event_name == 'release' || contains(inputs.ecosystems, 'nuget'))
        run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: sdk/dotnet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  crates:
    name: crates.io
    if: github.repository == 'houyidb-community/houyidb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo test -p houyidb-client
      - run: cargo package -p houyidb-client
      - uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate
      - if: >-
          (github.event_name == 'release' || inputs.publish) &&
          (github.event_name == 'release' || contains(inputs.ecosystems, 'crates'))
        run: cargo publish -p houyidb-client --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  java:
    name: Java (build artifacts)
    if: github.repository == 'houyidb-community/houyidb'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test build publishAllPublicationsToLocalBuildRepository
        working-directory: sdk/java/houyidb
      - uses: actions/upload-artifact@v4
        with:
          name: java-packages
          path: |
            sdk/java/houyidb/build/libs/*.jar
            sdk/java/houyidb/build/repo/**

# Maven Central 与 Go 子模块标签需要人工/额外凭据：
# - Maven Central: 使用 Sonatype Central Portal bundle 上传，需 GPG 签名与
#   namespace 验证；本 workflow 只产出本地 Maven repo 与 jar。
# - Go: 发布后需打 tag `sdk/go/houyidb/vX.Y.Z`，否则 go get 无法解析子模块。
