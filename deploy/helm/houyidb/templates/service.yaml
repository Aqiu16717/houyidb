apiVersion: v1
kind: Service
metadata:
  name: {{ include "houyidb.fullname" . }}
  labels:
    {{- include "houyidb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "houyidb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: pgwire
      port: {{ .Values.service.pgwirePort }}
      targetPort: pgwire
    {{- if ne .Values.role "follower" }}
    - name: replication
      port: {{ .Values.service.replicationPort }}
      targetPort: replication
    {{- end }}
